name: 'GitHub Profile Visualizer'
description: 'All-in-one developer telemetry: 3D city, coding habits, radar, LeetCode, GFG, HackerRank & Duolingo cards'
author: 'Tharun4743'

inputs:
  username:
    description: 'Target GitHub username'
    required: false
    default: ${{ github.repository_owner }}
  visualizers:
    description: 'Visualizers to generate: "all" or comma-separated list ("3d-city,activity,habits,languages,leetcode,gfg,hackerrank,duolingo,achievements,velocity,radar,summary")'
    required: false
    default: 'all'
  theme:
    description: 'Color theme: pearl-neon, solar-light, ocean-light, github-light (automatically maps any legacy/dark request to light aesthetic)'
    required: false
    default: 'pearl-neon'
  custom-colors:
    description: 'Optional comma-separated list of 5 hex colors for levels 0 to 4 (e.g. "#161b22,#0e4429,#006d32,#26a641,#39d353")'
    required: false
    default: ''
  custom-bg:
    description: 'Optional canvas background hex color'
    required: false
    default: ''
  title:
    description: 'Custom header title for the 3D city'
    required: false
    default: ''
  transparent:
    description: 'Render with transparent background for seamless theme integration (true/false)'
    required: false
    default: 'false'
  border-radius:
    description: 'Corner radius in pixels (e.g. 0, 8, 14, 20)'
    required: false
    default: ''
  show-border:
    description: 'Whether to display card borders (true/false)'
    required: false
    default: 'true'
  hide-header:
    description: 'Whether to hide top header and telemetry counters in 3D city (true/false)'
    required: false
    default: 'false'
  hide-legend:
    description: 'Whether to hide bottom activity legend (true/false)'
    required: false
    default: 'false'
  animate:
    description: 'Whether to enable pulsing neon light reflection animations across towers (true/false)'
    required: false
    default: 'true'
  height-scale:
    description: 'Multiplier for 3D tower elevation (e.g. 1.0, 1.5, 2.0)'
    required: false
    default: '1.0'
  year:
    description: 'Year to fetch contributions for (e.g. 2025) or "last-year"'
    required: false
    default: 'last-year'
  leetcode-username:
    description: 'LeetCode username for problem solving telemetry (defaults to GitHub username)'
    required: false
    default: ''
  gfg-username:
    description: 'GeeksforGeeks username for problem solving stats (defaults to GitHub username)'
    required: false
    default: ''
  hackerrank-username:
    description: 'HackerRank username for badges and achievements (defaults to GitHub username)'
    required: false
    default: ''
  duolingo-username:
    description: 'Duolingo username for language streak telemetry (defaults to GitHub username)'
    required: false
    default: ''
  radar-skills:
    description: 'Custom comma-separated skills and scores for radar (e.g. "Algorithms:0.94,Full Stack:0.96,Distributed:0.88,System Design:0.90,APIs & DBs:0.95")'
    required: false
    default: ''
  exclude-repos:
    description: 'Comma-separated list of repository names or substrings to exclude from activity feed and stats'
    required: false
    default: ''
  output-dir:

    description: 'Target directory where generated SVG files will be saved'
    required: false
    default: 'assets'
  filename:
    description: 'Filename for primary 3D city SVG'
    required: false
    default: 'profile-3d-city.svg'
  generate-all:
    description: 'Whether to generate all 10 theme variants of the 3D city (true/false)'
    required: false
    default: 'false'
  token:
    description: 'GitHub token (e.g. secrets.GITHUB_TOKEN) for API queries'
    required: false
    default: ${{ github.token }}

outputs:
  svg-path:
    description: 'Path to generated 3D City SVG'
  activity-svg-path:
    description: 'Path to generated Recent Activity SVG'
  habits-svg-path:
    description: 'Path to generated Coding Habits SVG'
  languages-svg-path:
    description: 'Path to generated Language Matrix SVG'
  leetcode-svg-path:
    description: 'Path to generated LeetCode Telemetry SVG'
  gfg-svg-path:
    description: 'Path to generated GeeksforGeeks Telemetry SVG'
  hackerrank-svg-path:
    description: 'Path to generated HackerRank Achievements SVG'
  duolingo-svg-path:
    description: 'Path to generated Duolingo Streak SVG'
  achievements-svg-path:
    description: 'Path to generated Achievements & Trophies SVG'
  velocity-svg-path:
    description: 'Path to generated Commit Velocity Wave SVG'
  radar-svg-path:
    description: 'Path to generated Skills Radar SVG'
  summary-svg-path:
    description: 'Path to generated Executive Summary Banner SVG'
  total-contributions:
    description: 'Total number of contributions found'
  active-days:
    description: 'Total number of active contribution days'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'activity'
  color: 'purple'
