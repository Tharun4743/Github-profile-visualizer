<svg width="467" height="195" viewBox="0 0 467 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #c0caf5; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .star-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
  </style>
  <rect x="0.5" y="0.5" width="466" height="194" rx="8" fill="#090d16" stroke="#243048" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(24, 30)">
    <text fill="#00ea64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">
      🎖️ HackerRank Achievements • @Tharun4743
    </text>
    <text x="419" y="0" text-anchor="end" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
      Level 1
    </text>
  </g>

  <!-- Badges / Stars -->
  <g transform="translate(24, 56)">
    <g transform="translate(0, 0)">
      <text class="stat-label">Primary Track:</text>
      <text x="220" class="stat-val" fill="#00ea64">Problem Solving (Algorithms)</text>
    </g>
    <g transform="translate(0, 26)">
      <text class="stat-label">Challenges Solved:</text>
      <text x="220" class="stat-val" fill="#00d26a">0 challenges</text>
    </g>
    <g transform="translate(0, 52)">
      <text class="stat-label">Profile Standing:</text>
      <text x="220" class="stat-val" fill="#8b949e">Active Candidate (Lvl 1)</text>
    </g>
  </g>

  <!-- Summary Footer Line -->
  <g transform="translate(24, 168)">
    <text fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
      Total Solved: <tspan fill="#00ea64" font-weight="700">0</tspan> • Earned Stars: <tspan fill="#ffa116" font-weight="700">0★</tspan>
    </text>
  </g>

  <!-- Personal Branding Watermark -->
  <a href="https://github.com/Tharun4743/github-profile-visualizer" target="_blank">
    <text x="443" y="183" text-anchor="end" fill="#565f89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" opacity="0.85">⚡ by @Tharun4743</text>
  </a>
</svg>