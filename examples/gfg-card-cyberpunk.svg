<svg width="467" height="195" viewBox="0 0 467 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #c0caf5; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; }
  </style>
  <rect x="0.5" y="0.5" width="466" height="194" rx="8" fill="#090d16" stroke="#243048" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(24, 30)">
    <text fill="#2f8d46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">
      🌿 GeeksforGeeks Telemetry • @Tharun4743
    </text>
  </g>

  <!-- Distribution Progress Bar -->
  <g transform="translate(24, 46)">
    <rect x="0" y="0" width="419" height="6" rx="3" fill="#282a36" />
    <rect x="0" y="0" width="0" height="6" rx="3" fill="#00b8a3" />
    <rect x="0" y="0" width="0" height="6" fill="#00ea64" />
    <rect x="0" y="0" width="0" height="6" fill="#ffc01e" />
    <rect x="0" y="0" width="419" height="6" rx="3" fill="#ff375f" />
  </g>

  <!-- Metrics Grid -->
  <g transform="translate(24, 66)">
    <g transform="translate(0, 10)">
      <text class="stat-label">Total Solved:</text>
      <text x="240" class="stat-val" fill="#2f8d46">0</text>
    </g>
    <g transform="translate(0, 34)">
      <text class="stat-label">Basic / School:</text>
      <text x="240" class="stat-val" fill="#00b8a3">0</text>
    </g>
    <g transform="translate(0, 58)">
      <text class="stat-label">Easy Problems:</text>
      <text x="240" class="stat-val" fill="#00ea64">0</text>
    </g>
    <g transform="translate(0, 82)">
      <text class="stat-label">Medium / Hard:</text>
      <text x="240" class="stat-val" fill="#ffc01e">0 / <tspan fill="#ff375f">0</tspan></text>
    </g>
    <g transform="translate(0, 106)">
      <text class="stat-label">Coding Score / Streak:</text>
      <text x="240" class="stat-val" fill="#8b949e">0 pts • 0d 🔥</text>
    </g>
  </g>

  <!-- Personal Branding Watermark -->
  <a href="https://github.com/Tharun4743/github-profile-visualizer" target="_blank">
    <text x="443" y="183" text-anchor="end" fill="#565f89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" opacity="0.85">⚡ by @Tharun4743</text>
  </a>
</svg>